<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="基于 Prompt 工程的上市公司财报解读与行业对标系统: 底层精确计算财务指标与行业分位, 上层三层 Prompt 驱动大模型生成可溯源的解读报告。" />
  <meta name="keywords" content="财报分析,行业对标,Prompt工程,财务指标,上市公司" />
  <meta name="theme-color" content="#14304f" />
  <title>财报智读 · 上市公司财报解读与行业对标系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317406f'/%3E%3Crect x='8' y='17' width='3.6' height='7' rx='1.2' fill='%23fff'/%3E%3Crect x='14.2' y='12' width='3.6' height='12' rx='1.2' fill='%23fff'/%3E%3Crect x='20.4' y='8' width='3.6' height='16' rx='1.2' fill='%234a89e0'/%3E%3C/svg%3E" />
  <style>
    /* 首屏骨架: 在 JS bundle 解析完成前避免白屏 */
    html, body { margin: 0; background: #eef2f7; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; color: #52637a;
    }
    #boot .ring {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #d3dde8; border-top-color: #2f6fd0;
      animation: spin .8s linear infinite;
    }
    #boot .t1 { font-size: 15px; font-weight: 600; color: #12305a; letter-spacing: .5px; }
    #boot .t2 { font-size: 12px; color: #8a97a8; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="ring"></div>
    <div class="t1">财报智读 · 正在加载</div>
    <div class="t2">上市公司财报解读与行业对标系统</div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
